name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          extension=""
          if [[ "$GOOS" == "windows" ]]; then extension=".exe"; fi
          go build -trimpath \
            -ldflags "-s -w -X thesinding/teamsctl/internal/version.Value=$VERSION" \
            -o "dist/teamsctl${extension}" ./cmd/teamsctl

          archive="teamsctl-${VERSION}-${GOOS}-${GOARCH}"
          if [[ "$GOOS" == "windows" ]]; then
            (cd dist && zip "${archive}.zip" "teamsctl.exe")
            rm "dist/teamsctl.exe"
          else
            tar -czf "dist/${archive}.tar.gz" -C dist teamsctl
            rm "dist/teamsctl"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: teamsctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
